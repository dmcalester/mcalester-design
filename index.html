      <div id="playground">
         <canvas id="lighttrail-canvas"></canvas>
         <!--
            Notes
            This playground area harkens back to the early days of Flash on the web when early in my career.
            Tweaking numbers or operations in math formulas I didn’t fully understand to see new patterns,
            new art emerge was mesmerizing. I’d spend hours experimenting with different formulas in Flash
            and when I wasn’t doing that scribbling psuedo-code on a yellow legal pad to try when I got home.

            This first experiment is playing on the concept of connecting dots. It’s something I’ve come
            to realize is one of my unique skills. The dots I connect are varied, sometimes it’s people to
            people or teams to teams, sometimes it’s technology, sometimes it’s ideas. Not all of them last
            not all of them result in anything, but they are always worth the effort and help me learn.

            This piece riffs on that idea. A grid of dots that either through interaction or automation
            form connections. As a connection completes a closed path it leaves a permanent lasting shape
            even as the connections between dots fade. Dots retain memory, like neurons and once "forgotten"
            dots when activated again will spark out reconnecting to previous dots.

            This piece also reflects a core memory from my mentor Gary Birch, a multimedia pioneer in Southern
            California. I was in his multimedia class at the Laguna College of Art and Design when I wanted
            to do some physics based code for an interaction. Gary said he knew a guy and sent an email to the
            two of us with nothing but a simple subject line: "Connecting dots". I hadn‘t thought about that
            email in years until working on this site and I love how this piece captures that forgotten
            connection and reignites it around the permanent shape the connection created.


         //-->
